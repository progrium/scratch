[workspace]
resolver = "2"
members = ["crates/*"]
# Everything except `host` and `gpuifs` builds and tests with no display or GPU.
default-members = [
    "crates/proto",
    "crates/style",
    "crates/catalog",
    "crates/tree",
    "crates/ninep",
    "crates/h9sys",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
proto = { path = "crates/proto" }
style = { path = "crates/style" }
catalog = { path = "crates/catalog" }
tree = { path = "crates/tree" }
ninep = { path = "crates/ninep" }
h9sys = { path = "crates/h9sys" }
host = { path = "crates/host" }

bytes = "1"
futures = "0.3"
async-trait = "0.1"
smol = "2"

# GPUI pins. gpui-component comes from GPUI Kit at one git rev; gpui is the
# `gpui-pre` snapshot that exact rev's workspace pins (`gpui = { package =
# "gpui-pre", version = "=0.3.12" }` in its Cargo.toml). Bump both together.
#   gpui-component rev: cf945af2d6491ff9bc175f3f1656a14793987db2 (longbridge/gpui-component, 2026-11-21)
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "cf945af2d6491ff9bc175f3f1656a14793987db2" }
