# Generator for crates/style/src/table.rs and theme.rs. Not a workspace member:
# it links GPUI, which the pure `style` crate must not. Run ./gen.sh after
# bumping the gpui or gpui-component pins in ../../../Cargo.toml.
[package]
name = "style-gen"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# Keep these two pins identical to the workspace Cargo.toml (gen.sh checks).
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["inspector"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "cf945af2d6491ff9bc175f3f1656a14793987db2", features = ["inspector"] }
gpui-base = { git = "https://github.com/longbridge/gpui-component", rev = "cf945af2d6491ff9bc175f3f1656a14793987db2", features = ["inspector"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = "1"
