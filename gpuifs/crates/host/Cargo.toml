[package]
name = "host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
proto.workspace = true
style.workspace = true
catalog.workspace = true
tree.workspace = true
bytes.workspace = true
futures.workspace = true
async-trait.workspace = true
gpui.workspace = true
# `syntect`: syntax highlighting for the editor, markdown code blocks and diffs (W6d).
gpui-component = { workspace = true, features = ["syntect"] }
ninep.workspace = true
serde_json = "1"
# W6a: civil dates for date-picker and calendar (GPUI Kit's own date type).
jiff = "1.0"
# W6d: the editor's completion/hover providers speak LSP types; `diff` turns
# `old`/`new` into a unified patch with `similar`. Versions match gpui-component's.
anyhow = "1"
lsp-types = { version = "0.97.0", features = ["proposed"] }
similar = "2.7"
# gpui-kit at the same rev as gpui-component: the desktop platform
# (`gpui_kit::platform::application`), the default icon assets, and the
# `inspector` feature, which keeps gpui's style reflection table in release
# builds (the host resolves no-argument style words through it).
gpui-kit = { git = "https://github.com/longbridge/gpui-component", rev = "cf945af2d6491ff9bc175f3f1656a14793987db2", features = ["inspector"] }

[features]
# Exposes `host::testing` (the TestAppContext harness) to other crates.
test-support = ["gpui/test-support", "gpui-kit/test-support"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-kit = { git = "https://github.com/longbridge/gpui-component", rev = "cf945af2d6491ff9bc175f3f1656a14793987db2", features = ["inspector", "test-support"] }
