name: uitree-core

# The core job: Linux, no GPU. zig build test, then the 0.2 conformance
# suite and the example clients' tree-building phase on uitree-headless
# with apps in h9, and the terminal renderer's tests. The Zig pin is
# uitree/core/build.zig.zon's minimum_zig_version (uitree/tools/zig-pin);
# the pin job fails if renderer/tui or the hyper9 submodule disagree.
#
# The terminal engine (uitree/core/README.md): the core builds and tests
# with libghostty-vt (-Dterminal=ghostty, the default, which
# uitree/tools/ghostty-vt builds with its own Zig 0.17, cached in
# uitree/.local) and with the plain stand-in (-Dterminal=plain). The vt job runs libghostty-vt's smoke test
# through libuitcore.a on x86_64 and aarch64 Linux, macOS, and wasm32 in
# Node and Chromium.

on:
  push:
    branches: [uitree, main]
    paths: ["uitree/**", ".github/workflows/uitree-core.yml"]
  pull_request:
    branches: [uitree, main]
    paths: ["uitree/**", ".github/workflows/uitree-core.yml"]
  workflow_dispatch:

jobs:
  pin:
    name: zig pin
    runs-on: ubuntu-latest
    outputs:
      zig: ${{ steps.pin.outputs.zig }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - id: pin
        run: echo "zig=$(uitree/tools/zig-pin)" >>"$GITHUB_OUTPUT"
      - run: uitree/tools/zig-pin check

  core:
    name: core (Linux, no GPU)
    needs: pin
    runs-on: ubuntu-latest
    env:
      H9ROOT: ${{ github.workspace }}/uitree/third_party/hyper9/.local/9front/root-amd64
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ needs.pin.outputs.zig }}" }
      # libghostty-vt and the Zig 0.17 that builds it (tools/ghostty-vt).
      - uses: actions/cache@v4
        with:
          path: uitree/.local
          key: uitree-ghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uitree/tools/ghostty-vt') }}
      - name: zig build test -Dterminal=ghostty
        working-directory: uitree/core
        run: zig build test -Dterminal=ghostty --summary all
      - name: zig build test -Dterminal=plain
        working-directory: uitree/core
        run: zig build test -Dterminal=plain --summary all
      - name: zig build -Dh9=true
        working-directory: uitree/core
        run: zig build -Dh9=true
      # h9 uses KVM when it can open it, else its native backend; either runs
      # the suite. Hosted runners have /dev/kvm, but only root can open it.
      - name: Let the runner open /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        id: root
        with:
          path: uitree/third_party/hyper9/.local/9front/root-amd64
          key: uitree-root-amd64-${{ hashFiles('uitree/third_party/hyper9/scripts/pins.sh', 'uitree/third_party/hyper9/tools/isoroot.zig') }}
      - name: 9front amd64 root from the ISO
        if: steps.root.outputs.cache-hit != 'true'
        working-directory: uitree/third_party/hyper9
        run: |
          scripts/fetch.sh isoamd64
          . scripts/pins.sh
          zig build isoroot -- ".local/9front/9front-$NINEFRONT_RELEASE.amd64.iso" .local/9front/root-amd64
          rm -f .local/9front/*.iso
      # The cases marked "# view: linux" (32-pty) run busybox from Alpine's
      # minirootfs at #L; LINUXROOT is set for them only, since the
      # example clients' Linux runs need tools/linuxroot's fuller tree.
      - name: Alpine minirootfs for the Linux-view cases
        run: |
          curl -sSfL -o "$RUNNER_TEMP/alpine.tgz" https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/alpine-minirootfs-3.22.8-x86_64.tar.gz
          echo "2d7f46af9b7e86ad64ebeba3fe9b75b62dd5b259e708afb2ab21268f627696e5  $RUNNER_TEMP/alpine.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/alpine"
          tar xzf "$RUNNER_TEMP/alpine.tgz" -C "$RUNNER_TEMP/alpine"
      - name: conformance
        working-directory: uitree/tests/conformance
        env:
          LINUXROOT: ${{ runner.temp }}/alpine
        run: ./run -r -t 120
      - name: example clients (tree-building phase)
        working-directory: uitree/tests/conformance
        run: ./run-examples
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-out
          path: uitree/tests/conformance/out/

  tui:
    name: terminal renderer (Linux)
    needs: pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ needs.pin.outputs.zig }}" }
      # libghostty-vt and the Zig 0.17 that builds it (tools/ghostty-vt).
      - uses: actions/cache@v4
        with:
          path: uitree/.local
          key: uitree-ghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uitree/tools/ghostty-vt') }}
      - working-directory: uitree/renderer/tui
        run: zig build test -Dterminal=ghostty --summary all
      - working-directory: uitree/renderer/tui
        run: zig build test -Dterminal=plain --summary all
      - name: uitree-tui links (ghostty, plain, wasm32-wasi ghostty)
        working-directory: uitree/renderer/tui
        run: |
          zig build -Dh9=false -Dterminal=ghostty
          zig build -Dh9=false -Dterminal=plain
          zig build -Dh9=false -Dterminal=ghostty -Dtarget=wasm32-wasi -Doptimize=ReleaseSmall

  vt:
    name: libghostty-vt (${{ matrix.name }})
    needs: pin
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64-linux, os: ubuntu-latest }
          - { name: aarch64-linux, os: ubuntu-latest, args: "-Dtarget=aarch64-linux-musl -fqemu" }
          - { name: aarch64-macos, os: macos-latest }
          - { name: wasm32, os: ubuntu-latest, args: "-Dtarget=wasm32-wasi -Doptimize=ReleaseSmall" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: uitree/core
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - uses: mlugg/setup-zig@v2
        with: { version: "${{ needs.pin.outputs.zig }}" }
      # libghostty-vt and the Zig 0.17 that builds it (tools/ghostty-vt).
      - uses: actions/cache@v4
        with:
          path: uitree/.local
          key: uitree-ghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uitree/tools/ghostty-vt') }}
      - if: matrix.name == 'aarch64-linux'
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      # On wasm32 this only builds zig-out/web/vt-smoke.wasm.
      - name: zig build smoke
        run: zig build smoke -Dterminal=ghostty ${{ matrix.args }} --summary all
      - name: libuitcore.a for the target, both engines
        run: |
          zig build ${{ matrix.args }} -Dterminal=ghostty
          ls -l zig-out/lib zig-out/web 2>/dev/null || true
          zig build ${{ matrix.args }} -Dterminal=plain --prefix "$RUNNER_TEMP/plain"
          ls -l "$RUNNER_TEMP/plain/lib" "$RUNNER_TEMP/plain/web" 2>/dev/null || true
      - if: matrix.name == 'aarch64-linux'
        name: aarch64-linux-gnu too (links only)
        run: zig build -Dtarget=aarch64-linux-gnu -Dterminal=ghostty
      - if: matrix.name == 'wasm32'
        uses: actions/setup-node@v4
        with: { node-version: 24 }
      - if: matrix.name == 'wasm32'
        name: Playwright's Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - if: matrix.name == 'wasm32'
        name: the smoke test in Node and Chromium
        run: node tests/vt-smoke.mjs zig-out/web/vt-smoke.wasm
