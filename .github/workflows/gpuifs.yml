name: gpuifs

on:
  push:
    paths: ["gpuifs/**", ".github/workflows/gpuifs.yml"]
  pull_request:
    paths: ["gpuifs/**", ".github/workflows/gpuifs.yml"]

defaults:
  run:
    working-directory: gpuifs

jobs:
  pure:
    name: test pure crates (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: gpuifs }
      # default-members are the pure crates: proto style catalog tree ninep h9sys
      - run: cargo test

  host:
    name: check host (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: gpuifs }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev
      - run: cargo check -p host -p gpuifs
