<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uitree in a terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  #term { position: absolute; inset: 0; }
  #err { position: absolute; inset: 8px; font: 13px ui-monospace, monospace; color: #b00; white-space: pre-wrap; pointer-events: none; }
</style>
<body>
<div id="term"></div>
<div id="err"></div>
<script type="module">
// One app on the terminal renderer, filling the page: tui.html?app=NAME
// (apps.js). The grid is as many cells as fit.
import { startTui } from './tui.js';
import { runApp } from './uit-web.js';
import { apps, argvFor, filesFor } from './apps.js';
const q = new URLSearchParams(location.search);
const app = q.get('app') ?? 'counter';
const dec = new TextDecoder();
const err = (s) => { document.getElementById('err').textContent += s + '\n'; };
window.appLog = [];
try {
  if (!apps[app]) throw new Error(`no app ${app}`);
  const el = document.getElementById('term');
  // xterm.js at fontSize 15: about 9 by 18 px a cell.
  const cols = Math.max(20, Math.floor(el.clientWidth / 9)), rows = Math.max(8, Math.floor(el.clientHeight / 18));
  const tui = await startTui(el, { cols, rows, onTitle: (t) => { document.title = t; } });
  window.tui = tui;
  runApp(tui.core, {
    argv: argvFor(app),
    files: await filesFor(app),
    onOutput: (fd, d) => { const s = dec.decode(d); window.appLog.push(s); console.log(`[${fd}] ${s}`); },
    onExit: (code, msg) => { window.appExit = code; if (code) err(`exit ${code} ${msg ?? ''}`); },
  });
  tui.term.focus();
} catch (e) {
  err(e?.stack ?? String(e));
}
</script>
