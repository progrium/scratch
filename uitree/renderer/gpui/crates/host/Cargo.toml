[package]
name = "host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The GPUI host: draws the core's committed tree through uitcore.h"

[dependencies]
uitcore.workspace = true
gpui.workspace = true
gpui-component.workspace = true
# The desktop platform, the full Lucide icon set (AllAssets) and the
# `inspector` feature, which keeps gpui's style reflection table in release
# builds (the host resolves no-argument style words through it).
gpui-kit.workspace = true
futures.workspace = true
serde_json = "1"
# Civil dates for date-picker and calendar (GPUI Kit's own date type).
jiff = "1.0"
# The editor's completion/hover providers speak LSP types; `diff` turns
# `old`/`new` into a unified patch with `similar`. Versions match gpui-component's.
anyhow = "1"
lsp-types = { version = "0.97.0", features = ["proposed"] }
similar = "2.7"

# std::time panics on wasm32-unknown-unknown: Instant and SystemTime from
# the browser's clock there (uitree/web).
[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1.1"
# The `web` node's browser surface: an iframe over the canvas.
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlIFrameElement", "CssStyleDeclaration", "DomRect", "MessageEvent", "EventTarget", "Node"] }

# `syntect`: syntax highlighting for the editor, markdown code blocks and
# diffs. Not on the web, where its syntax set is 5 MB of the download
# (uitree/web/README.md): code shows as plain text there.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui-component = { workspace = true, features = ["syntect"] }
gpui-webview = { workspace = true, optional = true }
wry = { workspace = true, optional = true }

[features]
default = ["webview"]
# The `web` node as a native page (components/web): WKWebView on macOS,
# WebView2 on Windows, WebKitGTK on Linux (libwebkit2gtk-4.1-dev and
# libgtk-3-dev to build; the window then runs on X11 or XWayland). Off,
# a `web` node draws as a placeholder with its URL.
webview = ["dep:gpui-webview", "dep:wry"]
# Exposes `host::testing` (the TestAppContext harness) to other crates.
test-support = ["gpui/test-support", "gpui-kit/test-support", "uitcore/test-client"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
uitcore = { workspace = true, features = ["test-client"] }
