[workspace]
resolver = "2"
members = ["crates/*"]
# uitcore-sys and uitcore build and test with no display or GPU.
default-members = ["crates/uitcore-sys", "crates/uitcore"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
uitcore-sys = { path = "crates/uitcore-sys" }
uitcore = { path = "crates/uitcore" }
host = { path = "crates/host" }

# The same pins as uitreefs (gpui-component rev and its gpui-pre snapshot).
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "cf945af2d6491ff9bc175f3f1656a14793987db2" }
gpui-kit = { git = "https://github.com/longbridge/gpui-component", rev = "cf945af2d6491ff9bc175f3f1656a14793987db2", features = ["inspector"] }
futures = "0.3"

